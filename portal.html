<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Portal — Montana TimberLine FireWood Co.</title>
<meta name="robots" content="noindex, nofollow">

<!--
  DEV NOTE:
  This page is a simple links page, NOT real security. Anyone who
  guesses this URL can currently see it and click through. To
  actually lock it down:

  1. In the Cloudflare dashboard, go to Zero Trust -> Access -> Applications.
  2. Add an application for this path (e.g. montanatimberline.com/portal.html)
     and/or for maintenance.montanatimberline.com directly.
  3. Set the policy to only allow specific staff emails (or a login method
     like Google/Microsoft). Cloudflare then shows its own login screen
     BEFORE anyone reaches this page or the maintenance app at all.

  Once that's set up, this page's own "login" styling is just for looks —
  Cloudflare is doing the actual gatekeeping.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #EDE5D0;
    --paper: #F6F1E3;
    --ink: #241D14;
    --ink-soft: #4A4132;
    --forest: #32453A;
    --forest-dark: #22302A;
    --bark: #5B3F2C;
    --amber: #C88A2E;
    --amber-dark: #A9701F;
    --moss: #7C8863;
    --line: rgba(34,28,18,0.14);
    --display: 'Fraunces', serif;
    --body: 'Inter', sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    padding: 24px;
  }
  .panel{
    max-width: 460px;
    width:100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 40px 36px;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--amber-dark);
    margin-bottom: 10px;
  }
  h1{
    font-family: var(--display);
    font-weight: 600;
    font-size: 1.7rem;
    color: var(--forest-dark);
    margin: 0 0 8px;
  }
  .sub{ color: var(--ink-soft); font-size: 0.95rem; margin: 0 0 28px; }

  .option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 8px;
    text-decoration:none;
    color: var(--ink);
    margin-bottom: 14px;
    transition: border-color 0.15s, transform 0.15s;
  }
  .option:hover{ border-color: var(--forest); transform: translateY(-1px); }
  .option.disabled{
    opacity: 0.55;
    pointer-events: none;
  }
  .option .name{
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.1rem;
  }
  .option .desc{ font-size: 0.85rem; color: var(--ink-soft); margin-top: 2px; }
  .option .tag{
    font-family: var(--mono);
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--moss);
    white-space: nowrap;
  }

  .back{
    display:inline-block;
    margin-top: 10px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back:hover{ color: var(--forest-dark); }
</style>
</head>
<body>

  <div class="panel">
    <div class="eyebrow">Montana TimberLine FireWood Co. · Staff</div>
    <h1>Where do you need to go?</h1>
    <p class="sub">Pick a tool below. (Real login/access control gets set up in Cloudflare — see dev note in this page's source.)</p>

    <!--
      Currently pointing at the live Cloudflare Pages URL. Once
      maintenance.montanatimberline.com is set up as a custom domain
      on this same Pages project, you can swap the href to that instead
      (or just leave this one — both will keep working).
    -->
    <a class="option" href="https://mtl-system.pages.dev/" target="_blank" rel="noopener">
      <div>
        <div class="name">Maintenance</div>
        <div class="desc">Equipment &amp; site maintenance app</div>
      </div>
      <span class="tag">Open →</span>
    </a>

    <!-- Excel / POS option: destination still undecided. Leave disabled until that's settled. -->
    <div class="option disabled">
      <div>
        <div class="name">Excel Sheet</div>
        <div class="desc">POS &amp; customer data</div>
      </div>
      <span class="tag">Coming soon</span>
    </div>

    <a class="back" href="index.html">← Back to site</a>
  </div>

</body>
</html>
